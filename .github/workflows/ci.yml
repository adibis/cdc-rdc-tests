name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  contributors:
    # Every commit author must have signed CONTRIBUTORS (the DCO).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh scripts/check-contributors.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
  generated-docs:
    # The catalog and the case counts in README.md and docs/attributes.md
    # come from the manifests; fail if they drifted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gen-catalog.py --check
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
